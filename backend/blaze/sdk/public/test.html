<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDK test page</title>
  <style>
    body { font: 16px/1.6 -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h1 { letter-spacing: -0.02em; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    button { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-size: 13px; }
    button:hover { background: #f1f5f9; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>NexCent SDK — test page</h1>
  <p>Edit <code>data-api-key</code> below to point at your live key, then open this in a browser. The popups fire automatically; use the controls to reset.</p>

  <div class="controls">
    <button onclick="localStorage.clear(); sessionStorage.clear(); location.reload()">Reset all popups (clear storage)</button>
    <button onclick="localStorage.removeItem('_nx_config_v1'); location.reload()">Refetch config</button>
    <button onclick="fetch('/cart/add.js', { method: 'POST' }).catch(()=>{}); alert('simulated add-to-cart — check Network tab + analytics')">Simulate add-to-cart</button>
  </div>

  <p>Edit the script tag below in <code>backend/sdk/public/test.html</code>:</p>

  <!-- replace data-api-key and data-api with real values once deployed -->
  <script async
          src="/v1/popup.js"
          data-api-key="REPLACE_WITH_YOUR_KEY"
          data-api="http://localhost:5001/YOUR-PROJECT/asia-south1"
          data-debug="true"></script>
</body>
</html>
